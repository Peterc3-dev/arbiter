name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lint + test tooling
        # Only the lightweight tooling — the project's TUI stack (textual/rich)
        # and pyyaml are intentionally NOT installed here. The unit tests in
        # tests/unit/ depend solely on the standard library.
        run: pip install ruff pytest

      - name: Ruff (static lint)
        run: ruff check .

      - name: Pytest (pure-logic unit tests)
        # Scoped to tests/unit/ which imports only stdlib-backed modules
        # (tools.registry, process.manager). The integration tests under
        # tests/ require the full dependency set and are run separately.
        run: pytest -q tests/unit
